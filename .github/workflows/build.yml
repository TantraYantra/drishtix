name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Test (Windows, Python 3.11)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt

      - name: Run database tests
        run: python tests/smoke_test_database.py

      - name: Run scanner tests
        run: python tests/test_scanner.py

      - name: Run matching tests
        run: python tests/test_matching.py

  build:
    name: Package Windows installer
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt

      - name: Build application
        run: pyinstaller PeopleLens.spec --noconfirm --clean

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          & $iscc "installer\PeopleLens.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create portable ZIP and checksums
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $zip = "release\PeopleLens-$version-windows11-x64.zip"
          Compress-Archive -Path "dist\PeopleLens\*" -DestinationPath $zip -CompressionLevel Optimal
          $assets = @(
            "release\PeopleLens-Setup.exe",
            $zip
          )
          $lines = foreach ($a in $assets) {
            $hash = (Get-FileHash $a -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $a -Leaf)"
          }
          $lines | Set-Content "release\SHA256SUMS.txt" -Encoding ascii

      - name: Show release assets
        shell: pwsh
        run: Get-ChildItem release | Select-Object Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: peoplelens-windows
          path: |
            release/PeopleLens-Setup.exe
            release/PeopleLens-*-windows11-x64.zip
            release/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/PeopleLens-Setup.exe
            release/PeopleLens-*-windows11-x64.zip
            release/SHA256SUMS.txt
